<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>太阳系 · 3D 运转演示</title>
    <meta name="description" content="一个可拖动、可缩放的太阳系 3D 页面：太阳、八大行星、月球与冥王星。" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <header class="hud hud-top">
      <h1>太阳系</h1>
      <p>拖动旋转 · 滚轮缩放 · 点击星球查看资料</p>
    </header>

    <aside id="info-card" class="info-card" hidden aria-live="polite">
      <button id="info-close" class="info-close" type="button" aria-label="关闭资料卡">×</button>
      <div id="info-body"></div>
    </aside>

    <footer class="hud hud-bottom">
      <button id="btn-pause" class="btn" type="button" aria-pressed="false">暂停</button>

      <label class="speed" for="speed">
        <span class="speed-label">速度</span>
        <input id="speed" type="range" min="0" max="10" step="0.1" value="1" />
        <output id="speed-value" class="speed-value" for="speed">1.0×</output>
      </label>

      <button id="btn-labels" class="btn" type="button" aria-pressed="true">隐藏名称</button>
    </footer>

    <div id="webgl-error" class="webgl-error" hidden>
      <p>当前浏览器不支持 WebGL，无法显示 3D 太阳系。</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
